requires-python = ">=3.12,<3.13"
dependencies = ["laya==0.3.4", "torch==2.8.0", "transformers==4.57.6", "huggingface-hub==0.36.0", "safetensors==0.6.2", "numpy==2.2.6"]

[tool.uv.sources]
torch = { index = "pytorch-cpu" }

[[tool.uv.index]]
